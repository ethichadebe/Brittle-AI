name: CI

on:
  pull_request:
  workflow_dispatch: {}

# This is an npm workspaces monorepo with a single lockfile at the repo root, so
# every job installs from `.` and scopes its commands with `-w <workspace>`.
#
# The `lint` slot runs ESLint over that job's Target. It is invoked from the
# repo root, not through `-w`, because the flat config lives at the root and
# covers all three workspaces. Typechecking has not been lost: every Target's
# `build` runs `tsc`, so a type error still fails the job.

jobs:
  types:
    uses: ethichadebe/workflows/.github/workflows/node-checks.yml@main
    with:
      working-directory: .
      lint: npx eslint packages/types
      build: npm run build -w packages/types

  frontend:
    uses: ethichadebe/workflows/.github/workflows/node-checks.yml@main
    with:
      working-directory: .
      lint: npx eslint frontend
      test: npm run test -w frontend
      build: npm run build -w frontend

  backend:
    uses: ethichadebe/workflows/.github/workflows/node-checks.yml@main
    with:
      working-directory: .
      # The Prisma client is generated, not committed, so nothing in the backend
      # typechecks or builds until `db:generate` has run.
      install: npm ci && npm run db:generate -w backend
      lint: npx eslint backend
      # The pure suite: scrapers, parsing, the image proxy, the compose
      # env-wiring check. It opens no database connection, so it runs here
      # alongside lint and build. The suite that does need one runs in
      # `backend-db` below.
      test: npm run test:unit -w backend
      build: npm run build -w backend

  # Written out longhand rather than called through
  # `ethichadebe/workflows/.github/workflows/node-checks.yml` because that
  # workflow takes no `services:` input, and these tests need a live Postgres
  # with the migrations applied. Everything else mirrors the shared workflow so
  # the two stay comparable.
  backend-db:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accucery
          POSTGRES_PASSWORD: accucery
          POSTGRES_DB: accucery_test
        ports:
          - 5432:5432
        # Without this, `prisma migrate deploy` races the server's startup and
        # fails with P1001.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # A throwaway database created by the service block above and destroyed with
    # the runner. It is not a credential for anything, and it is the same pair
    # the local default in `backend/vitest.db.config.ts` already uses.
    env:
      DATABASE_URL: postgresql://accucery:accucery@localhost:5432/accucery_test
      DATABASE_URL_TEST: postgresql://accucery:accucery@localhost:5432/accucery_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # This job installs the whole workspace to run one test file, so the
          # registry round-trip is the bulk of it.
          cache: npm

      - name: Install
        run: npm ci && npm run db:generate -w backend

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma

      - name: Test
        run: npm run test:db -w backend

  # The shell test harnesses. Until this job existed they ran nowhere: `test` in
  # this repo meant "whatever vitest finds inside an npm workspace", and a test
  # that is neither a vitest file nor inside a workspace had no home, so ~660
  # lines of it were silently never executed on a pull request.
  #
  # That mattered most for report.test.sh, which exists to prove a secret cannot
  # ride along into a comment on this PUBLIC repo — the same class of risk the
  # `secrets` job below runs on every pull request.
  #
  # They need bash and python3 and nothing else: no network, no store, no app,
  # no ScraperAPI credits, no npm install. That is why this job is cheap enough
  # to run unconditionally.
  #
  # scripts/probe-game.test.mjs is deliberately NOT here. It drives a real
  # Chromium and needs the workspace installed, so it would turn this job into
  # a browser job. Running it is a separate decision, not an oversight.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the shell test harnesses
        run: |
          set -uo pipefail
          status=0
          for t in scripts/*.test.sh; do
            echo "=== $t"
            # Each harness ends in `[ "$FAIL" -eq 0 ]`, so a failure is its exit
            # status. Keep going rather than stopping at the first one: on a
            # phone, one CI run showing every failure beats three showing one.
            bash "$t" || status=1
          done
          exit "$status"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the checked-out tree, not git history. History still holds the
      # env.prod values untracked in #13; those are being rotated, and a history
      # scan would paint every pull request red until the rewrite happens.
      # Change `dir .` to `git .` once history has been purged.
      #
      # This repo is public, so its CI logs are too. Only the rule, file and
      # line are printed — never the finding line, which can show content
      # sitting next to the redacted value (adjacent fields of a cookie
      # header, for one). That is enough to find and fix it locally.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks

          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact \
            --report-format json --report-path findings.json --exit-code 0

          COUNT=$(jq 'length' findings.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "No secrets found."
            exit 0
          fi
          echo "::error::gitleaks found $COUNT potential secret(s)."
          jq -r '.[] | "  \(.RuleID)  \(.File):\(.StartLine)"' findings.json
          echo
          echo "Reproduce locally with:"
          echo "  gitleaks dir . --config .gitleaks.toml --redact --verbose"
          echo "If it is a false positive, allowlist it in .gitleaks.toml or mark"
          echo "the line with a 'gitleaks:allow' comment, with a reason."
          exit 1
