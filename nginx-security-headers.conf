# Security headers on every response (#153). Included at the server level and
# again in every location that sets a header of its own: nginx drops the
# server's add_header lines from any location that has one, which would leave
# exactly the cached pages (index.html, sw.js) without them.
#
# The content security policy for the page itself is a <meta> tag written at
# build time (frontend/src/build/csp.ts), because it has to name the exact
# inline scripts the opening animation uses. A header can't, but this one
# carries frame-ancestors, which a <meta> tag can't.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Location (#131) and the camera for photo search, for this site only;
# nothing else is ever asked for.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
# The site is only served over HTTPS. Sub-domains of ethichadebe.me are left
# alone: they're other projects.
add_header Strict-Transport-Security "max-age=31536000" always;
# Not a security header, but needed on every page for the same reason: asks
# Chrome to tell the app the phone's model and platform, kept with the
# shopper's shopping history (backend/src/services/collect.ts). Browsers
# that don't support client hints ignore it.
add_header Accept-CH "Sec-CH-UA-Model, Sec-CH-UA-Platform" always;
