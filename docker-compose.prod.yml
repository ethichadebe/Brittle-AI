# Every container's log is capped at 3 files of 10 MB, so logs can never fill
# the disk. The server also sets this for every container on it, other apps
# included, in /etc/docker/daemon.json (docs/server-upkeep.md, "The disk").
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Set by the dispatcher in .env at Cutover, by digest, and kept so the
    # previous value can be put back. Nothing is built on the server any more:
    # CI pushes to ghcr and the box only pulls. See
    # https://github.com/ethichadebe/workflows/blob/main/docs/compose-destination.md
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CHECKERS_COOKIES: ${CHECKERS_COOKIES}
      SHOPRITE_COOKIES: ${SHOPRITE_COOKIES}
      SCRAPERAPI_KEY: ${SCRAPERAPI_KEY}
      WOOLWORTHS_SEARCH_KEY: ${WOOLWORTHS_SEARCH_KEY}
      WOOLWORTHS_PRICE_ZONE: ${WOOLWORTHS_PRICE_ZONE:-}
      # #147: email. The server refuses to start in production without the key.
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM:-}
      # #171: Premium, through Paystack. Without the key and both plans,
      # Premium simply isn't offered.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PLAN_MONTHLY: ${PAYSTACK_PLAN_MONTHLY:-}
      PAYSTACK_PLAN_YEARLY: ${PAYSTACK_PLAN_YEARLY:-}
      PAYSTACK_CARD_CHECK_CENTS: ${PAYSTACK_CARD_CHECK_CENTS:-}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-}
      # #155: the app's own alerts (a store failing, ScraperAPI credits low),
      # through the same bot as the deploy and site monitor. Without them the
      # alerts are simply off.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # The Owner's dashboard (/admin): the one Account allowed to open it.
      # Without it, nobody can.
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # Photo search: Claude reads the photo. Without it, the camera is hidden.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    logging: *logging
    ports:
      # Publishes on port 80 by default. A host already running something on 80
      # — a system nginx fronting several apps, say — sets FRONTEND_PORT in .env
      # to something like 127.0.0.1:8082 and proxies to it. Keep this a variable
      # rather than editing the file: a locally-modified compose file cannot be
      # updated by `git pull`, which is how SCRAPERAPI_KEY went missing here for
      # four months.
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
