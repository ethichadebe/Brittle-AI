services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CHECKERS_COOKIES: ${CHECKERS_COOKIES}
      SCRAPERAPI_KEY: ${SCRAPERAPI_KEY}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      # Publishes on port 80 by default. A host already running something on 80
      # — a system nginx fronting several apps, say — sets FRONTEND_PORT in .env
      # to something like 127.0.0.1:8082 and proxies to it. Keep this a variable
      # rather than editing the file: a locally-modified compose file cannot be
      # updated by `git pull`, which is how SCRAPERAPI_KEY went missing here for
      # four months.
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
