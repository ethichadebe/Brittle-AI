<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Accucery</title>
    <meta name="description" content="Your grocery list with live store prices, and where it's cheaper." />
    <!-- Installable app (#118): the browser bar and status bar in teal. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d7a70" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Accucery" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /* Opening animation. The A draws itself and the tick checks in, then
         it drops into the name as its first letter. The rest comes into
         focus, reading "ccuracy" until it's sharp enough to see it says
         "ccucery", and the whole wordmark glides up to become the home
         screen's title. Here rather than in React so it's on screen from
         the first frame, while the app loads underneath it. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #0d7a70;
        color: #fff;
      }
      #splash[hidden] { display: none; }
      #splash > * { grid-area: 1 / 1; }
      #splash .splash-mark { width: auto; height: 132px; overflow: visible; transform-origin: 0 0; }
      #splash .splash-a { stroke-dasharray: 700; stroke-dashoffset: 700; }
      #splash .splash-tick { stroke-dasharray: 260; stroke-dashoffset: 260; }
      #splash .splash-word {
        font: 800 32px/1 "Inter Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: -0.02em;
        white-space: nowrap;
        transform-origin: 0 0;
      }
      #splash .splash-word .wordmark-a { opacity: 0; }
      #splash .splash-rest { display: inline-block; opacity: 0; }
      /* The letters that differ, stacked: "rac" gives way to "cer". */
      #splash .splash-swap { display: inline-grid; }
      #splash .splash-swap > span { grid-area: 1 / 1; text-align: center; }
      #splash .splash-to { opacity: 0; }

      /* The logo standing in for the "A" of Accucery; the home screen's title
         uses the same sizes (index.css), so one can land exactly on the other. */
      .wordmark-a { display: inline-block; height: 0.74em; width: auto; margin-right: 0.02em; vertical-align: -0.005em; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true" hidden>
      <div class="splash-word"><svg class="wordmark-a" viewBox="124 86 264 340">
          <path class="wordmark-a-stroke" d="M150 400L256 112l106 288" stroke="currentColor" stroke-width="52" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="wordmark-tick" d="M196 300l38 36 86-86" stroke="#7fe3d6" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span class="splash-rest">ccu<span class="splash-swap"><span class="splash-from">rac</span><span class="splash-to">cer</span></span>y</span></div>
      <svg class="splash-mark" viewBox="124 86 264 340">
          <path class="splash-a wordmark-a-stroke" d="M150 400L256 112l106 288" stroke="currentColor" stroke-width="52" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="splash-tick wordmark-tick" d="M196 300l38 36 86-86" stroke="#7fe3d6" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <script>
      // Plays when the installed app is opened fresh: once per app session,
      // so switching back to it, or reloading onto a new build, doesn't
      // replay it. Never for someone who asked their phone for less motion.
      // A tap skips it. "?splash" in the address plays it anywhere, to see it.
      (function () {
        var splash = document.getElementById("splash");
        try {
          var installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
          var asked = /[?&]splash(=|&|$)/.test(location.search);
          var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
          var seen = sessionStorage.getItem("accucery:splashShown");
          if (!calm && (asked || (installed && !seen)) && splash.animate) {
            sessionStorage.setItem("accucery:splashShown", "1");
            play(splash);
            return;
          }
        } catch (e) {
          // No storage, media queries or animations: just open the app.
        }
        splash.remove();

        function play(splash) {
          splash.hidden = false;
          var q = function (sel) { return splash.querySelector(sel); };
          var mark = q(".splash-mark"), word = q(".splash-word"), letter = q(".splash-word .wordmark-a");
          var rest = q(".splash-rest"), from = q(".splash-from"), to = q(".splash-to");
          var timing = function (delay, duration, easing) {
            return { delay: delay, duration: duration, easing: easing || "ease-in-out", fill: "both" };
          };
          var animations = [];
          var run = function (el, frames, t) { animations.push(el.animate(frames, t)); };

          // 1. The A draws itself, then the tick.
          run(q(".splash-mark .splash-a"), [{ strokeDashoffset: 700 }, { strokeDashoffset: 0 }], timing(100, 460, "cubic-bezier(.65,0,.35,1)"));
          run(q(".splash-mark .splash-tick"), [{ strokeDashoffset: 260 }, { strokeDashoffset: 0 }], timing(520, 280, "cubic-bezier(.3,1.4,.6,1)"));

          // 2. It drops into the name as its first letter.
          var m = mark.getBoundingClientRect(), l = letter.getBoundingClientRect();
          run(mark, [{ transform: "none" }, { transform: "translate(" + (l.left - m.left) + "px," + (l.top - m.top) + "px) scale(" + l.height / m.height + ")" }], timing(850, 420));
          run(mark, [{ opacity: 1 }, { opacity: 0 }], timing(1270, 1, "linear"));
          run(letter, [{ opacity: 0 }, { opacity: 1 }], timing(1270, 1, "linear"));

          // 3. "ccuracy" fades in, blurred, and comes into focus as "ccucery".
          run(rest, [{ opacity: 0, filter: "blur(3px)" }, { opacity: 1, filter: "blur(3px)" }], timing(1120, 260, "ease-out"));
          run(rest, [{ filter: "blur(3px)" }, { filter: "blur(5px)", offset: 0.45 }, { filter: "blur(0)" }], { delay: 1400, duration: 720, easing: "ease-in-out", fill: "forwards" });
          run(from, [{ opacity: 1 }, { opacity: 0 }], timing(1650, 260));
          run(to, [{ opacity: 0 }, { opacity: 1 }], timing(1650, 260));

          var finished = false;
          var title = null;
          var finish = function () {
            if (finished) return;
            finished = true;
            animations.forEach(function (a) { a.cancel(); });
            splash.remove();
            if (title) title.style.visibility = "";
          };

          // 4. The wordmark glides up to become the home screen's title, as
          //    the teal falls away. Off the home screen, it just fades.
          var fly = function () {
            if (finished) return;
            title = document.querySelector(".home-wordmark");
            var w = word.getBoundingClientRect();
            var ease = "cubic-bezier(.65,0,.35,1)";
            if (title) {
              var t = title.getBoundingClientRect();
              var scale = parseFloat(getComputedStyle(title).fontSize) / parseFloat(getComputedStyle(word).fontSize);
              var tick = title.querySelector(".wordmark-tick");
              title.style.visibility = "hidden";
              run(word, [
                { transform: "none", color: "#fff" },
                { transform: "translate(" + (t.left - w.left) + "px," + (t.top - w.top) + "px) scale(" + scale + ")", color: getComputedStyle(title).color },
              ], timing(0, 560, ease));
              run(letter.querySelector(".wordmark-tick"), [{ stroke: "#7fe3d6" }, { stroke: getComputedStyle(tick).stroke }], timing(0, 560, ease));
            } else {
              run(word, [{ opacity: 1 }, { opacity: 0 }], timing(0, 300));
            }
            var fade = splash.animate([{ backgroundColor: "rgba(13,122,112,1)" }, { backgroundColor: "rgba(13,122,112,0)" }], timing(0, 560, ease));
            animations.push(fade);
            fade.onfinish = finish;
          };
          var flight = setTimeout(fly, 2250);
          splash.addEventListener("click", function () {
            clearTimeout(flight);
            finish();
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
