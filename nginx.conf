# /welcome shows exactly what a first visit to / does (the landing page), so
# search engines are told / is the one to list (2026-10-21). An HTTP header
# rather than a tag in the page: index.html is one file for every address.
# $request_uri is the address asked for, even once it is served as index.html.
map $request_uri $canonical_link {
    ~^/welcome/?(\?|$)  "<https://$host/>; rel=\"canonical\"";
    default              "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # #153. Repeated in each location below that adds a header of its own.
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy /api/* to the backend, stripping the /api prefix
    location /api/ {
        proxy_pass         http://backend:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # For search engines: made by the backend, which knows the app's address.
    location = /robots.txt {
        proxy_pass         http://backend:3000/robots.txt;
        proxy_set_header   Host              $host;
    }

    location = /sitemap.xml {
        proxy_pass         http://backend:3000/sitemap.xml;
        proxy_set_header   Host              $host;
    }

    # #118: what says "a new version is out" must never be served from a
    # cache, or an installed app would keep running old code after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        # Empty, so not sent, everywhere but /welcome (the map above).
        add_header Link $canonical_link;
        # A shared link's preview needs full addresses (index.html): this
        # site's own, from the address the visitor asked for. The host's
        # nginx passes that on (Host) and serves only HTTPS.
        sub_filter         '__SITE_ORIGIN__' 'https://$host';
        sub_filter_once    off;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Vite names every asset after its content, so a cached copy is never
    # wrong: keep it for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Photo search's readers (frontend/src/build/reader.ts), fetched on a
    # phone's first photo. Their folder is named after their contents, so a
    # new version is a new address: keep them for a year. The engine is
    # mostly text, so compressing it nearly halves the download.
    location /reader/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { text/javascript js; application/wasm wasm; application/gzip gz; }
        gzip on;
        gzip_types text/javascript application/wasm;
        try_files $uri =404;
    }

    # SPA fallback — React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
